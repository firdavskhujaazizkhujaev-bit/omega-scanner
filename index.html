<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер штрих-кода</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f1f5f9; }
    h2 { text-align: center; color: #28a745; margin-bottom: 6px; }
    .hint { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 14px; }

    #readerWrap { position: relative; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 11px; overflow: hidden; }
    #reader { width: 100%; }

    #scanLine {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e 20%, #22c55e 80%, transparent);
      box-shadow: 0 0 8px 2px rgba(34,197,94,.7);
      top: 20%;
      animation: scanMove 2.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes scanMove {
      0%   { top: 20%; }
      50%  { top: 75%; }
      100% { top: 20%; }
    }

    #result { margin-top: 16px; text-align: center; font-size: 16px; padding: 12px; word-break: break-all; }
    .found { color: #15803d; font-weight: 700; }
    .error { color: #dc3545; font-weight: 700; }
    .controls { max-width: 480px; margin: 12px auto 0; display: flex; gap: 10px; }
    button { flex: 1; padding: 12px 16px; font-size: 15px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-weight: 700; }
    #torchBtn { background: #f59e0b; color: #fff; display: none; }
    #closeBtn { background: #dc3545; color: #fff; }

    .manual-block { max-width: 480px; margin: 20px auto 0; padding: 16px; background: #fff; border-radius: 11px; border: 1px solid #e2e8f0; }
    .manual-block label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 8px; }
    .manual-row { display: flex; gap: 8px; }
    .manual-row input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .manual-row button { flex: 0 0 auto; padding: 12px 18px; background: #28a745; color: #fff; }
  </style>
</head>
<body>
  <h2>📷 Сканер штрих-кода</h2>
  <div class="hint">Держите код на расстоянии 10–15 см, ровно и при хорошем освещении</div>

  <div id="readerWrap">
    <div id="reader"></div>
    <div id="scanLine"></div>
  </div>

  <div id="result"></div>
  <div class="controls">
    <button id="torchBtn" onclick="toggleTorch_()">💡 Фонарик</button>
    <button id="closeBtn">Закрыть без сканирования</button>
  </div>

  <div class="manual-block">
    <label>Не считывается? Введите цифры штрих-кода вручную:</label>
    <div class="manual-row">
      <input type="text" id="manualInput" inputmode="numeric" placeholder="Например: 4870144863382">
      <button onclick="submitManual_()">Найти</button>
    </div>
  </div>

  <script>
    var appUrl = 'https://script.google.com/macros/s/AKfycbyiXQzXONmWEyi9hKPzdfAEaBlWkqt85zIejqN0v8TA5_pdbHlmg-P6YlKz8zEvaEqF/exec';

    document.getElementById('closeBtn').onclick = function () {
      window.location.href = appUrl;
    };

    function goToApp_(code) {
      window.location.href = appUrl + '?scanned=' + encodeURIComponent(code);
    }

    function submitManual_() {
      var val = document.getElementById('manualInput').value.trim();
      if (!val) { return; }
      goToApp_(val);
    }

    document.getElementById('manualInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submitManual_();
    });

    var scanner = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    });
    var resultEl = document.getElementById('result');
    var handled = false;
    var torchOn = false;

    scanner.start(
      { facingMode: 'environment' },
      {
        fps: 15,
        qrbox: { width: 300, height: 170 },
        videoConstraints: {
          facingMode: 'environment',
          width: { min: 1280, ideal: 1920, max: 2560 },
          height: { min: 720, ideal: 1080, max: 1440 }
        }
      },
      function (decodedText) {
        if (handled) return;
        handled = true;

        document.getElementById('scanLine').style.display = 'none';

        resultEl.innerHTML =
          '<span class="found">✔ Найдено: ' + decodedText + '</span>';

        scanner.stop().catch(function () {});

        goToApp_(decodedText);
      },
      function () { /* игнор кадров без штрих-кода */ }
    ).then(function () {
      var capabilities = scanner.getRunningTrackCameraCapabilities ? scanner.getRunningTrackCameraCapabilities() : null;
      if (capabilities && capabilities.torchFeature && capabilities.torchFeature().isSupported()) {
        document.getElementById('torchBtn').style.display = 'block';
      }
    }).catch(function (err) {
      document.getElementById('scanLine').style.display = 'none';
      resultEl.innerHTML = '<span class="error">Не удалось открыть камеру: ' + err + '</span>';
    });

    function toggleTorch_() {
      torchOn = !torchOn;
      var capabilities = scanner.getRunningTrackCameraCapabilities ? scanner.getRunningTrackCameraCapabilities() : null;
      if (capabilities && capabilities.torchFeature) {
        capabilities.torchFeature().apply(torchOn).catch(function () {});
      }
      document.getElementById('torchBtn').textContent = torchOn ? '💡 Выключить' : '💡 Фонарик';
    }
  </script>
</body>
</html>
