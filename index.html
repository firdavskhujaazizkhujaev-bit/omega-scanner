<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер штрих-кода</title>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f1f5f9; }
    h2 { text-align: center; color: #28a745; margin: 4px 0 10px; font-size: 17px; }
    .hint { text-align: center; color: #64748b; font-size: 11px; margin-bottom: 8px; }

    .manual-block { max-width: 480px; margin: 0 auto 10px; padding: 10px 12px; background: #fff; border-radius: 10px; border: 2px solid #28a745; }
    .manual-block label { display: block; font-size: 12px; font-weight: 700; color: #15803d; margin-bottom: 6px; }
    .manual-row { display: flex; gap: 6px; }
    .manual-row input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 7px; }
    .manual-row button { flex: 0 0 auto; padding: 10px 16px; background: #28a745; color: #fff; border: none; border-radius: 7px; font-weight: 700; font-size: 14px; cursor: pointer; }

    .camera-toggle { max-width: 480px; margin: 0 auto 6px; text-align: center; }
    .camera-toggle button { background: #64748b; color: #fff; border: none; border-radius: 7px; padding: 8px 14px; font-size: 12px; cursor: pointer; }

    #readerWrap { position: relative; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 10px; overflow: hidden; background: #000; display: none; }
    #reader { width: 100%; }
    #reader video, #reader canvas { width: 100% !important; height: auto !important; display: block; }
    #nativeVideo { width: 100%; display: block; }

    #scanBox {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 30%;
      bottom: 30%;
      border: 3px solid #22c55e;
      border-radius: 8px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,.35);
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    #scanLine {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e 20%, #22c55e 80%, transparent);
      box-shadow: 0 0 8px 2px rgba(34,197,94,.7);
      top: 0;
      animation: scanMove 2s ease-in-out infinite;
      pointer-events: none;
      z-i#readerWrap { height: 320px; }
#reader { height: 100%; }
#reader video, #reader canvas { width: 100% !important; height: 100% !important; object-fit: cover; display: block; }
#nativeVideo { width: 100%; height: 100%; object-fit: cover; display: block; }ndex: 11;
    }
    @keyframes scanMove {
      0%   { top: 0; }
      50%  { top: 100%; }
      100% { top: 0; }
    }

    #result { margin-top: 8px; text-align: center; font-size: 14px; padding: 8px; word-break: break-all; }
    .found { color: #15803d; font-weight: 700; }
    .error { color: #dc3545; font-weight: 700; }
    .engine-note { text-align: center; font-size: 10px; color: #94a3b8; margin-top: 4px; }
    .controls { max-width: 480px; margin: 8px auto 0; display: flex; gap: 8px; }
    button.ctrl { flex: 1; padding: 9px 12px; font-size: 13px; border-radius: 7px; border: none; cursor: pointer; font-family: inherit; font-weight: 700; }
    #torchBtn { background: #f59e0b; color: #fff; display: none; }
    #closeBtn { background: #dc3545; color: #fff; }
  </style>
</head>
<body>
  <h2>📷 Добавить штрих-код</h2>

  <div class="manual-block">
    <label>✍️ Введите цифры штрих-кода:</label>
    <div class="manual-row">
      <input type="text" id="manualInput" inputmode="numeric" placeholder="Например: 4870144863382" autofocus>
      <button onclick="submitManual_()">Найти</button>
    </div>
  </div>

  <div class="camera-toggle">
    <button onclick="toggleCamera_()" id="cameraToggleBtn">📷 Попробовать сканировать камерой</button>
  </div>

  <div class="hint" id="cameraHint" style="display:none;">Держите код ровно в рамке, на расстоянии 10–15 см</div>

  <div id="readerWrap">
    <video id="nativeVideo" autoplay playsinline muted style="display:none;"></video>
    <div id="reader"></div>
    <div id="scanBox">
      <div id="scanLine"></div>
    </div>
  </div>

  <div id="result"></div>
  <div class="engine-note" id="engineNote"></div>
  <div class="controls" id="cameraControls" style="display:none;">
    <button class="ctrl" id="torchBtn" onclick="toggleTorch_()">💡 Фонарик</button>
  </div>

  <div class="controls">
    <button class="ctrl" id="closeBtn" style="background:#dc3545; color:#fff;">Закрыть без сканирования</button>
  </div>

  <script>
    var appUrl = 'https://script.google.com/macros/s/AKfycbyiXQzXONmWEyi9hKPzdfAEaBlWkqt85zIejqN0v8TA5_pdbHlmg-P6YlKz8zEvaEqF/exec';
    var handled = false;
    var torchOn = false;
    var cameraStarted = false;
    var usingNative = false;
    var nativeStream = null;
    var nativeDetectInterval = null;

    document.getElementById('closeBtn').onclick = function () {
      stopEverything_();
      window.location.href = appUrl;
    };

    function goToApp_(code) {
      window.location.href = appUrl + '?scanned=' + encodeURIComponent(code);
    }

    function submitManual_() {
      var val = document.getElementById('manualInput').value.trim();
      if (!val) { return; }
      goToApp_(val);
    }

    document.getElementById('manualInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submitManual_();
    });

    var resultEl = document.getElementById('result');

    function stopEverything_() {
      if (nativeDetectInterval) { clearInterval(nativeDetectInterval); nativeDetectInterval = null; }
      if (nativeStream) { nativeStream.getTracks().forEach(function (t) { t.stop(); }); nativeStream = null; }
      if (usingNative === false && cameraStarted) { try { Quagga.stop(); } catch (e) {} }
    }

    function toggleCamera_() {
      var wrap = document.getElementById('readerWrap');
      var hint = document.getElementById('cameraHint');
      var toggleBtn = document.getElementById('cameraToggleBtn');

      if (!cameraStarted) {
        wrap.style.display = 'block';
        hint.style.display = 'block';
        toggleBtn.textContent = '✖ Остановить камеру';
        startCamera_();
      } else {
        stopEverything_();
        wrap.style.display = 'none';
        hint.style.display = 'none';
        document.getElementById('cameraControls').style.display = 'none';
        toggleBtn.textContent = '📷 Попробовать сканировать камерой';
        cameraStarted = false;
      }
    }

    function startCamera_() {
      cameraStarted = true;

      // Пытаемся использовать нативный BarcodeDetector (Android Chrome/Samsung Internet
      // используют системный движок распознавания — точнее и быстрее, чем в JS)
      if ('BarcodeDetector' in window) {
        startNativeScanner_();
      } else {
        startQuaggaScanner_();
      }
    }

    function startNativeScanner_() {
      usingNative = true;
      document.getElementById('engineNote').innerText = '';

      var supportedFormats = [
        'ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'codabar', 'itf', 'qr_code'
      ];

      var detector;
      try {
        detector = new BarcodeDetector({ formats: supportedFormats });
      } catch (e) {
        startQuaggaScanner_();
        return;
      }

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      }).then(function (stream) {
        nativeStream = stream;
        var video = document.getElementById('nativeVideo');
        document.getElementById('reader').style.display = 'none';
        video.style.display = 'block';
        video.srcObject = stream;

        document.getElementById('cameraControls').style.display = 'flex';

        var track = stream.getVideoTracks()[0];
        if (track && track.getCapabilities) {
          try {
            var caps = track.getCapabilities();
            if (caps.torch) {
              document.getElementById('torchBtn').style.display = 'block';
              window._torchTrack = track;
            }
          } catch (e) {}
        }

        nativeDetectInterval = setInterval(function () {
          if (handled) return;
          detector.detect(video).then(function (codes) {
            if (codes.length > 0 && !handled) {
              handled = true;
              document.getElementById('scanLine').style.display = 'none';
              resultEl.innerHTML = '<span class="found">✔ Найдено: ' + codes[0].rawValue + '</span>';
              stopEverything_();
              goToApp_(codes[0].rawValue);
            }
          }).catch(function () {});
        }, 300);
      }).catch(function (err) {
        // Нет доступа к камере через нативный API — пробуем QuaggaJS
        startQuaggaScanner_();
      });
    }

    function startQuaggaScanner_() {
      usingNative = false;
      document.getElementById('nativeVideo').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      document.getElementById('engineNote').innerText = '';

      Quagga.init({
        inputStream: {
          type: 'LiveStream',
          target: document.getElementById('reader'),
          constraints: {
            facingMode: 'environment',
            width: { min: 640, ideal: 1280 },
            height: { min: 480, ideal: 720 }
          }
        },
        locator: {
          patchSize: 'medium',
          halfSample: true
        },
        numOfWorkers: 2,
        frequency: 10,
        decoder: {
          readers: [
            'ean_reader',
            'ean_8_reader',
            'upc_reader',
            'upc_e_reader',
            'code_128_reader',
            'code_39_reader',
            'codabar_reader',
            'i2of5_reader'
          ]
        },
        locate: true
      }, function (err) {
        if (err) {
          resultEl.innerHTML = '<span class="error">Не удалось открыть камеру: ' + err + '</span>';
          return;
        }
        Quagga.start();
        document.getElementById('cameraControls').style.display = 'flex';

        setTimeout(function () {
          try {
            var track = Quagga.CameraAccess.getActiveTrack();
            if (track && track.getCapabilities) {
              var caps = track.getCapabilities();
              if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
                track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
              }
              if (caps.torch) {
                document.getElementById('torchBtn').style.display = 'block';
                window._torchTrack = track;
              }
            }
          } catch (e) {}
        }, 600);
      });

      Quagga.onDetected(function (data) {
        if (handled) return;
        var code = data.codeResult.code;
        if (!code) return;

        handled = true;
        document.getElementById('scanLine').style.display = 'none';
        resultEl.innerHTML = '<span class="found">✔ Найдено: ' + code + '</span>';
        try { Quagga.stop(); } catch (e) {}
        goToApp_(code);
      });
    }

    function toggleTorch_() {
      if (!window._torchTrack) return;
      torchOn = !torchOn;
      window._torchTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
      document.getElementById('torchBtn').textContent = torchOn ? '💡 Выключить' : '💡 Фонарик';
    }
  </script>
</body>
</html>
